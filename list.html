<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品列表 - 校园二手交易平台</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">

    <style>
        /* 面包屑导航 */
        .breadcrumb {
            padding: 18px 0 2px;
            color: #7a6a55;
            font-size: 13px;
        }
        .breadcrumb a { color: #9e2b25; }
        .breadcrumb a:hover { text-decoration: underline; }
        .breadcrumb em { color: #4a3b2a; font-style: normal; }  

        /* 筛选表单 */
        .filter-box {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 16px;
            padding: 22px 26px;
            margin: 12px 0 30px;
        }
        .filter-box .form-item {
            margin-bottom: 0;             
            flex: 1 1 190px;               
        }
        .filter-box .form-item label { font-size: 13px; margin-bottom: 5px; }
        .filter-box .btn { flex: 0 0 auto; } 

        /* 列表页小标题 */
        .page-head { margin: 4px 0 0; }
        .page-head h2 { font-size: 22px; color: #4a3b2a; }
        .page-head span { color: #8c8578; font-size: 13px; }
    </style>
</head>
<body>

    <!-- ==================== 页眉 + 导航 ==================== -->
    <header class="header">
        <div class="container header-inner">
            <a href="index.html" class="logo">校园<span>二手</span>交易平台</a>
            <nav class="nav" id="nav">
                <a href="index.html">首页</a>
                <a href="list.html" class="active">商品列表</a>       
                <a href="publish.html">发布商品</a>
                <a href="about.html">关于我们</a>
                <a href="login.html">登录</a>
            </nav>
            <button class="nav-toggle" id="navToggle">&#9776;</button>
        </div>
    </header>

    <main class="container">

        <!-- ==================== 面包屑导航 ==================== -->
        <div class="breadcrumb">
            <a href="index.html">首页</a> <span>/</span> <em>商品列表</em>
        </div>

        <!-- ==================== 筛选区 ==================== -->
        <form class="form-box filter-box" action="list.html" method="get">
            <div class="form-item">
                <label for="cate">商品分类</label>
                <select id="cate" name="cate">
                    <option value="">全部分类</option>
                    <option value="book">教材书籍</option>
                    <option value="digital">数码电子</option>
                    <option value="bike">代步工具</option>
                    <option value="dorm">宿舍用品</option>
                    <option value="clothes">服装鞋帽</option>
                    <option value="other">其他闲置</option>
                </select>
            </div>

            <div class="form-item">
                <label for="sort">价格排序</label>
                <select id="sort" name="sort">
                    <option value="default">默认排序</option>
                    <option value="priceAsc">价格从低到高</option>
                    <option value="priceDesc">价格从高到低</option>
                    <option value="newest">最新发布</option>
                </select>
            </div>

            <div class="form-item">
                <label for="kw">关键词搜索</label>
                <input type="text" id="kw" name="kw" placeholder="例如：高数、键盘、山地车">
            </div>

            <button class="btn" type="submit">搜索</button>
        </form>

        <!-- ==================== 商品数量提示 ==================== -->
        <div class="page-head">
            <h2>全部闲置好物</h2>
            <span>共找到 8 件商品 · 同校当面交易更放心</span>
        </div>

        <!-- ==================== 商品卡片网格 ==================== -->
        <div class="goods-grid" id="goodsList">
        </div>

        <!-- ==================== 分页 ==================== -->
        <div class="pager" id="pager"></div>

    </main>

    <!-- ==================== 页脚 ==================== -->
    <footer class="footer">
        <div class="container">
            <p>校园二手交易平台 2026</p>
        </div>
    </footer>

    <!-- 回到顶部按钮 -->
    <button class="back-top" id="backTop">↑</button>

    <script src="data/goods.js"></script>
    <script src="js/list.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
